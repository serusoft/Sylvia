<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WhatsApp Style Chat - Fixed Firebase</title>
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, limit, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAWb2IuKrtSQzmJSLHWR2cgsAR1mbXwwoo",
      authDomain: "sylivia-19116.firebaseapp.com",
      projectId: "sylivia-19116",
      storageBucket: "sylivia-19116.firebasestorage.app",
      messagingSenderId: "904125881889",
      appId: "1:904125881889:web:ebbc013df9caa425e80d60",
      measurementId: "G-ZR03Q2TMJW"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.auth = auth;
    window.db = db;
    window.updateProfile = updateProfile;
    window.signInWithEmailAndPassword = signInWithEmailAndPassword;
    window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
    window.signOut = signOut;
    window.onAuthStateChanged = onAuthStateChanged;
    window.collection = collection;
    window.addDoc = addDoc;
    window.query = query;
    window.orderBy = orderBy;
    window.onSnapshot = onSnapshot;
    window.serverTimestamp = serverTimestamp;
    window.limit = limit;
    window.getDocs = getDocs;
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .auth-card {
      background: white;
      border-radius: 24px;
      padding: 32px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .auth-card h2 {
      color: #075e54;
      margin-bottom: 24px;
    }

    .auth-input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 30px;
      font-size: 16px;
      outline: none;
    }

    .auth-input:focus {
      border-color: #25d366;
    }

    .auth-btn {
      background: #075e54;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .auth-btn:hover {
      background: #0a6b5f;
    }

    .toggle-auth {
      margin-top: 20px;
      color: #075e54;
      cursor: pointer;
      font-size: 14px;
    }

    .error-msg {
      color: red;
      font-size: 12px;
      margin-top: 8px;
    }

    .success-msg {
      color: green;
      font-size: 12px;
      margin-top: 8px;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      max-height: 700px;
      background: #efeae2;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
    }

    .chat-header {
      background: #075e54;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      background: #25d366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: #075e54;
    }

    .contact-info {
      flex: 1;
    }

    .contact-name {
      font-weight: 600;
      font-size: 18px;
    }

    .contact-status {
      font-size: 12px;
      opacity: 0.8;
    }

    .logout-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .messages-area::-webkit-scrollbar {
      width: 6px;
    }

    .message {
      display: flex;
      margin-bottom: 4px;
      max-width: 80%;
      animation: fadeInUp 0.2s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.sent {
      align-self: flex-end;
      justify-content: flex-end;
    }

    .message.received {
      align-self: flex-start;
    }

    .bubble {
      background: white;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 14.5px;
      line-height: 1.4;
      word-wrap: break-word;
      max-width: 100%;
      box-shadow: 0 1px 0.5px rgba(0,0,0,0.12);
    }

    .message.sent .bubble {
      background: #dcf8c5;
      border-bottom-right-radius: 4px;
    }

    .message.received .bubble {
      background: white;
      border-bottom-left-radius: 4px;
    }

    .message-time {
      font-size: 10px;
      color: rgba(0,0,0,0.45);
      margin-top: 4px;
      text-align: right;
    }

    .sender-name {
      font-size: 11px;
      font-weight: bold;
      color: #075e54;
      margin-bottom: 4px;
    }

    .input-area {
      background: #f0f0f0;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #e0e0e0;
    }

    .emoji-btn {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .emoji-btn:hover {
      background: #e2e2e2;
    }

    .message-input {
      flex: 1;
      border: none;
      background: white;
      padding: 12px 16px;
      border-radius: 30px;
      font-size: 15px;
      outline: none;
    }

    .message-input:focus {
      outline: none;
      box-shadow: 0 0 0 2px #25d36650;
    }

    .send-btn {
      background: #075e54;
      border: none;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
    }

    .send-btn:hover {
      background: #0a6b5f;
    }

    .emoji-picker {
      position: absolute;
      bottom: 80px;
      left: 10px;
      right: 10px;
      background: white;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 200;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid #ddd;
    }

    .emoji-picker span {
      font-size: 32px;
      cursor: pointer;
      text-align: center;
      padding: 8px;
      border-radius: 12px;
      transition: 0.1s;
    }

    .emoji-picker span:hover {
      background: #f0f0f0;
      transform: scale(1.1);
    }

    .hidden {
      display: none;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>
<div id="authContainer"></div>
<div id="chatApp" class="chat-container hidden">
  <div class="chat-header">
    <div class="avatar">💬</div>
    <div class="contact-info">
      <div class="contact-name" id="userNameDisplay">Chat</div>
      <div class="contact-status" id="userEmailDisplay">Loading...</div>
    </div>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>
  <div class="messages-area" id="messagesArea">
    <div class="loading">✨ Loading messages... ✨</div>
  </div>
  <div class="input-area">
    <button class="emoji-btn" id="emojiBtn">😊</button>
    <input type="text" class="message-input" id="messageInput" placeholder="Type a message..." autocomplete="off">
    <button class="send-btn" id="sendBtn">📤</button>
  </div>
</div>

<script>
  (function() {
    setTimeout(() => {
      const auth = window.auth;
      const db = window.db;
      const updateProfile = window.updateProfile;
      const signInWithEmailAndPassword = window.signInWithEmailAndPassword;
      const createUserWithEmailAndPassword = window.createUserWithEmailAndPassword;
      const signOut = window.signOut;
      const onAuthStateChanged = window.onAuthStateChanged;
      const collection = window.collection;
      const addDoc = window.addDoc;
      const query = window.query;
      const orderBy = window.orderBy;
      const onSnapshot = window.onSnapshot;
      const serverTimestamp = window.serverTimestamp;
      const limit = window.limit;

      let currentUser = null;
      let unsubscribeMessages = null;

      const emojis = ['😀', '😂', '😍', '🥰', '😎', '🔥', '❤️', '👍', '🎉', '✨', '😭', '😱', '🙏', '💯', '🤣', '🥺', '😘', '🤔', '👀', '💬', '🌟', '⭐', '💡', '🎈', '🎁', '💝', '💖', '💗', '💓', '💞'];

      async function sendEmailNotification(senderName, senderEmail, messageText) {
        try {
          const formData = new FormData();
          formData.append('email', senderEmail);
          formData.append('message', `📱 NEW MESSAGE\n\nFrom: ${senderName}\nMessage: ${messageText}\nTime: ${new Date().toLocaleString()}`);
          formData.append('_subject', `New message from ${senderName}`);
          await fetch('https://formspree.io/f/xvznogjr', { method: 'POST', body: formData, headers: { 'Accept': 'application/json' } });
          console.log('Email sent');
        } catch (error) {
          console.error('Email error:', error);
        }
      }

      function renderAuth() {
        const container = document.getElementById('authContainer');
        container.innerHTML = `
          <div class="auth-overlay">
            <div class="auth-card">
              <h2>💬 WhatsApp Style Chat</h2>
              <div id="authMode">
                <input type="email" id="loginEmail" class="auth-input" placeholder="Email">
                <input type="password" id="loginPassword" class="auth-input" placeholder="Password">
                <button id="loginBtn" class="auth-btn">Login</button>
                <div class="toggle-auth" id="showSignup">Create new account →</div>
                <div id="authError" class="error-msg"></div>
              </div>
            </div>
          </div>
        `;

        document.getElementById('loginBtn').addEventListener('click', async () => {
          const email = document.getElementById('loginEmail').value;
          const password = document.getElementById('loginPassword').value;
          const errorDiv = document.getElementById('authError');
          try {
            await signInWithEmailAndPassword(auth, email, password);
          } catch (err) {
            errorDiv.textContent = err.message;
          }
        });

        document.getElementById('showSignup').addEventListener('click', () => {
          const modeDiv = document.getElementById('authMode');
          modeDiv.innerHTML = `
            <input type="email" id="signupEmail" class="auth-input" placeholder="Email">
            <input type="text" id="signupName" class="auth-input" placeholder="Your Name">
            <input type="password" id="signupPassword" class="auth-input" placeholder="Password">
            <button id="signupBtn" class="auth-btn">Create Account</button>
            <div class="toggle-auth" id="showLogin">← Back to Login</div>
            <div id="authError" class="error-msg"></div>
          `;
          document.getElementById('signupBtn').addEventListener('click', async () => {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const name = document.getElementById('signupName').value;
            const errorDiv = document.getElementById('authError');
            if (!name) {
              errorDiv.textContent = 'Please enter your name';
              return;
            }
            try {
              const userCred = await createUserWithEmailAndPassword(auth, email, password);
              await updateProfile(userCred.user, { displayName: name });
            } catch (err) {
              errorDiv.textContent = err.message;
            }
          });
          document.getElementById('showLogin').addEventListener('click', renderAuth);
        });
      }

      async function sendMessage(text) {
        if (!text.trim() || !currentUser) {
          console.log("Cannot send: no message or no user");
          return;
        }
        try {
          const messageData = {
            text: text.trim(),
            senderId: currentUser.uid,
            senderName: currentUser.displayName || currentUser.email.split('@')[0],
            senderEmail: currentUser.email,
            timestamp: serverTimestamp(),
            createdAt: new Date().toISOString()
          };
          const docRef = await addDoc(collection(db, 'messages'), messageData);
          console.log("Message sent! ID:", docRef.id);
          await sendEmailNotification(messageData.senderName, messageData.senderEmail, messageData.text);
        } catch (err) {
          console.error('Send error details:', err);
          alert(`Error sending message: ${err.message}. Please check Firebase Rules.`);
        }
      }

      function loadMessages() {
        if (unsubscribeMessages) unsubscribeMessages();
        const messagesQuery = query(collection(db, 'messages'), orderBy('timestamp', 'asc'), limit(200));
        
        unsubscribeMessages = onSnapshot(messagesQuery, (snapshot) => {
          const messagesArea = document.getElementById('messagesArea');
          if (!messagesArea) return;
          
          const shouldScroll = messagesArea.scrollHeight - messagesArea.scrollTop < 300;
          messagesArea.innerHTML = '';
          
          if (snapshot.empty) {
            messagesArea.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">✨ No messages yet. Start chatting! ✨</div>';
          }
          
          snapshot.forEach(doc => {
            const data = doc.data();
            if (!data.text) return;
            
            const isSent = currentUser && data.senderId === currentUser.uid;
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isSent ? 'sent' : 'received'}`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';
            
            if (!isSent && data.senderName) {
              const nameSpan = document.createElement('div');
              nameSpan.className = 'sender-name';
              nameSpan.textContent = data.senderName;
              bubbleDiv.appendChild(nameSpan);
            }
            
            const textNode = document.createTextNode(data.text);
            bubbleDiv.appendChild(textNode);
            
            const timeSpan = document.createElement('div');
            timeSpan.className = 'message-time';
            if (data.timestamp && data.timestamp.toDate) {
              const date = data.timestamp.toDate();
              timeSpan.textContent = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else {
              timeSpan.textContent = 'Just now';
            }
            bubbleDiv.appendChild(timeSpan);
            messageDiv.appendChild(bubbleDiv);
            messagesArea.appendChild(messageDiv);
          });
          
          if (shouldScroll) {
            messagesArea.scrollTop = messagesArea.scrollHeight;
          }
        }, (error) => {
          console.error("Snapshot error:", error);
          const messagesArea = document.getElementById('messagesArea');
          if (messagesArea) {
            messagesArea.innerHTML = `<div style="text-align: center; color: red; padding: 20px;">⚠️ Error loading messages: ${error.message}<br><br>Please check Firebase Rules! ⚠️</div>`;
          }
        });
      }

      let emojiPicker = null;
      function showEmojiPicker() {
        if (emojiPicker) {
          emojiPicker.remove();
          emojiPicker = null;
          return;
        }
        
        const picker = document.createElement('div');
        picker.className = 'emoji-picker';
        
        emojis.forEach(emoji => {
          const emojiSpan = document.createElement('span');
          emojiSpan.textContent = emoji;
          emojiSpan.onclick = (e) => {
            e.stopPropagation();
            const input = document.getElementById('messageInput');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const currentValue = input.value;
            const newValue = currentValue.substring(0, start) + emoji + currentValue.substring(end);
            input.value = newValue;
            input.focus();
            input.setSelectionRange(start + emoji.length, start + emoji.length);
            picker.remove();
            emojiPicker = null;
          };
          picker.appendChild(emojiSpan);
        });
        
        document.body.appendChild(picker);
        emojiPicker = picker;
        
        const closePicker = (e) => {
          if (!picker.contains(e.target) && e.target !== document.getElementById('emojiBtn')) {
            picker.remove();
            emojiPicker = null;
            document.removeEventListener('click', closePicker);
          }
        };
        setTimeout(() => document.addEventListener('click', closePicker), 100);
      }

      function initChat(user) {
        currentUser = user;
        document.getElementById('userNameDisplay').textContent = user.displayName || user.email.split('@')[0];
        document.getElementById('userEmailDisplay').textContent = user.email;
        document.getElementById('authContainer').innerHTML = '';
        document.getElementById('chatApp').classList.remove('hidden');
        
        loadMessages();
        
        const input = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const emojiBtn = document.getElementById('emojiBtn');
        
        const handleSend = () => {
          const msg = input?.value;
          if (msg && msg.trim()) {
            sendMessage(msg);
            input.value = '';
            input.focus();
          }
        };
        
        sendBtn.onclick = handleSend;
        input.onkeypress = (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
          }
        };
        emojiBtn.onclick = (e) => {
          e.stopPropagation();
          showEmojiPicker();
        };
      }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          initChat(user);
        } else {
          if (unsubscribeMessages) unsubscribeMessages();
          currentUser = null;
          document.getElementById('chatApp')?.classList.add('hidden');
          renderAuth();
        }
      });

      setTimeout(() => {
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
          logoutBtn.onclick = async () => {
            await signOut(auth);
          };
        }
      }, 500);
      
    }, 200);
  })();
</script>
</body>
</html>
